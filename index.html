<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live2D Haru - 交互角色</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 100vw; height: 100vh; overflow: hidden;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      user-select: none; -webkit-user-select: none;
      display: flex; flex-direction: column;
    }
    #toolbar {
      position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 10px; z-index: 10;
      background: rgba(0,0,0,.45); backdrop-filter: blur(10px);
      border-radius: 16px; padding: 8px 16px;
    }
    #toolbar button {
      padding: 8px 16px; border: 1px solid rgba(255,255,255,.2);
      border-radius: 10px; background: rgba(255,255,255,.08);
      color: #e0e0e0; cursor: pointer; font-size: 14px; font-family: inherit;
      transition: all .2s; white-space: nowrap;
    }
    #toolbar button:hover {
      background: rgba(255,255,255,.18); border-color: rgba(255,255,255,.4);
    }
    #toolbar button:active, #toolbar button.active {
      background: rgba(100,180,255,.3); border-color: rgba(100,180,255,.6);
      color: #fff;
    }
    #canvas-container {
      flex: 1; display: flex; align-items: center; justify-content: center;
      position: relative;
    }
    canvas { display: block; cursor: grab; }
    canvas:active { cursor: grabbing; }
    #hint {
      position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
      color: rgba(255,255,255,.5); font-size: 13px;
      pointer-events: none; transition: opacity .8s;
    }
    #loading {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
      color: rgba(255,255,255,.7); font-size: 18px;
      display: flex; flex-direction: column; align-items: center; gap: 12px;
    }
    .spinner {
      width: 36px; height: 36px; border: 3px solid rgba(255,255,255,.2);
      border-top-color: #fff; border-radius: 50%; animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="toolbar">
    <button onclick="setExpression('Normal')">普通</button>
    <button onclick="setExpression('Smile')">微笑</button>
    <button onclick="setExpression('Angry')">生气</button>
    <button onclick="setExpression('Sad')">悲伤</button>
    <button onclick="setExpression('Surprised')">惊讶</button>
    <button onclick="setExpression('Blushing')">害羞</button>
    <button onclick="doRandomMotion()">随机动作</button>
  </div>

  <div id="canvas-container">
    <canvas id="live2d"></canvas>
    <div id="loading"><div class="spinner"></div><span>加载模型中...</span></div>
    <div id="hint">拖拽可旋转模型 · 点击触发互动</div>
  </div>

  <script>
    // ==================== Live2D Cubism Core ====================
    const CORE_URL = 'https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js';
    const MODEL_BASE = 'https://cdn.jsdelivr.net/gh/Qing-Feng-123/live2Dsample@demo2/runtime/';
    const MODEL_JSON = MODEL_BASE + 'haru.model3.json';

    let canvas, gl, frameBuffer, frameTexture;
    let model, modelMatrix, moc;
    let motions = {}, expressions = {};
    let motionManager = { current: null, startTime: 0, reserve: null };
    let expressionManager = { current: null, reserve: null };
    let eyeBlink, breath;
    let physics, pose;
    let dragX = 0, dragY = 0, targetDragX = 0, targetDragY = 0;
    let isDragging = false, lastMouseX = 0, lastMouseY = 0;
    let mouseX = 0, mouseY = 0;
    let scale = 2.5, offsetX = 0, offsetY = -0.2;
    let lastTime = 0;
    let motionGroups = [];
    let idleTimer = 0;
    let idleMotionInterval = 5; // seconds between idle motions

    // ==================== Matrix ====================
    class CubismMatrix44 {
      constructor() {
        this._m = new Float32Array(16);
        this.identity();
      }
      identity() {
        const m = this._m;
        m[0]=1;m[1]=0;m[2]=0;m[3]=0;
        m[4]=0;m[5]=1;m[6]=0;m[7]=0;
        m[8]=0;m[9]=0;m[10]=1;m[11]=0;
        m[12]=0;m[13]=0;m[14]=0;m[15]=1;
      }
      get array() { return this._m; }
      translate(x, y, z) {
        const m = this._m;
        m[12] += m[0]*x + m[4]*y + m[8]*z;
        m[13] += m[1]*x + m[5]*y + m[9]*z;
        m[14] += m[2]*x + m[6]*y + m[10]*z;
      }
      scale(sx, sy, sz) {
        const m = this._m;
        m[0]*=sx; m[1]*=sx; m[2]*=sx;
        m[4]*=sy; m[5]*=sy; m[6]*=sy;
        m[8]*=sz; m[9]*=sz; m[10]*=sz;
      }
      rotateY(angle) {
        const m = this._m;
        const c = Math.cos(angle), s = Math.sin(angle);
        const m0=m[0],m1=m[1],m2=m[2],m8=m[8],m9=m[9],m10=m[10];
        m[0]=m0*c+m8*s; m[1]=m1*c+m9*s; m[2]=m2*c+m10*s;
        m[8]=m8*c-m0*s; m[9]=m9*c-m1*s; m[10]=m10*c-m2*s;
      }
      rotateX(angle) {
        const m = this._m;
        const c = Math.cos(angle), s = Math.sin(angle);
        const m4=m[4],m5=m[5],m6=m[6],m8=m[8],m9=m[9],m10=m[10];
        m[4]=m4*c+m8*s; m[5]=m5*c+m9*s; m[6]=m6*c+m10*s;
        m[8]=m8*c-m4*s; m[9]=m9*c-m5*s; m[10]=m10*c-m6*s;
      }
      setMatrix(m) {
        for (let i = 0; i < 16; i++) this._m[i] = m[i];
      }
      multiply(a, b) {
        const am=a._m||a, bm=b._m||b, r=new Float32Array(16);
        for(let i=0;i<4;i++)
          for(let j=0;j<4;j++)
            r[i+j*4]=am[i]*bm[j*4]+am[i+4]*bm[j*4+1]+am[i+8]*bm[j*4+2]+am[i+12]*bm[j*4+3];
        this._m.set(r);
      }
    }

    // ==================== WebGL Helpers ====================
    function createShader(gl, type, source) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        console.error('Shader error:', gl.getShaderInfoLog(shader));
        gl.deleteShader(shader);
        return null;
      }
      return shader;
    }

    function createProgram(gl, vs, fs) {
      const program = gl.createProgram();
      gl.attachShader(program, vs);
      gl.attachShader(program, fs);
      gl.linkProgram(program);
      if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
        console.error('Program error:', gl.getProgramInfoLog(program));
        gl.deleteProgram(program);
        return null;
      }
      return program;
    }

    const VERTEX_SHADER = `
      attribute vec2 a_position;
      attribute vec2 a_texCoord;
      varying vec2 v_texCoord;
      uniform mat4 u_matrix;
      void main() {
        gl_Position = u_matrix * vec4(a_position, 0.0, 1.0);
        v_texCoord = a_texCoord;
      }
    `;

    const FRAGMENT_SHADER = `
      precision mediump float;
      varying vec2 v_texCoord;
      uniform sampler2D u_texture;
      uniform vec4 u_baseColor;
      uniform vec4 u_multiplyColor;
      uniform vec4 u_screenColor;
      void main() {
        vec4 texColor = texture2D(u_texture, v_texCoord);
        vec4 c = texColor * u_baseColor;
        c.rgb = c.rgb + u_screenColor.rgb * c.a;
        c.rgb = mix(c.rgb, u_multiplyColor.rgb, u_multiplyColor.a);
        gl_FragColor = c;
      }
    `;

    let shaderProgram;
    let a_position, a_texCoord, u_matrix, u_texture, u_baseColor, u_multiplyColor, u_screenColor;

    // ==================== Model Loading ====================
    async function loadFile(url) {
      const resp = await fetch(url);
      if (!resp.ok) throw new Error(`Failed to load ${url}: ${resp.status}`);
      return url.endsWith('.json') || url.endsWith('.model3.json') ? resp.json() : resp.arrayBuffer();
    }

    async function loadTexture(gl, url) {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      return new Promise((resolve, reject) => {
        img.onload = () => {
          const tex = gl.createTexture();
          gl.bindTexture(gl.TEXTURE_2D, tex);
          gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
          gl.generateMipmap(gl.TEXTURE_2D);
          resolve(tex);
        };
        img.onerror = reject;
        img.src = url;
      });
    }

    async function init() {
      canvas = document.getElementById('live2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      gl = canvas.getContext('webgl', { alpha: true, premultipliedAlpha: true });
      if (!gl) { alert('WebGL not supported'); return; }

      gl.enable(gl.BLEND);
      gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
      gl.clearColor(0, 0, 0, 0);

      // Compile shaders
      const vs = createShader(gl, gl.VERTEX_SHADER, VERTEX_SHADER);
      const fs = createShader(gl, gl.FRAGMENT_SHADER, FRAGMENT_SHADER);
      shaderProgram = createProgram(gl, vs, fs);
      gl.useProgram(shaderProgram);
      a_position = gl.getAttribLocation(shaderProgram, 'a_position');
      a_texCoord = gl.getAttribLocation(shaderProgram, 'a_texCoord');
      u_matrix = gl.getUniformLocation(shaderProgram, 'u_matrix');
      u_texture = gl.getUniformLocation(shaderProgram, 'u_texture');
      u_baseColor = gl.getUniformLocation(shaderProgram, 'u_baseColor');
      u_multiplyColor = gl.getUniformLocation(shaderProgram, 'u_multiplyColor');
      u_screenColor = gl.getUniformLocation(shaderProgram, 'u_screenColor');

      // Load Cubism Core
      await new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = CORE_URL;
        s.onload = resolve;
        s.onerror = reject;
        document.head.appendChild(s);
      });

      // Load model
      const modelJson = await loadFile(MODEL_JSON);
      const mocData = await loadFile(MODEL_BASE + modelJson.FileReferences.Moc);
      moc = Live2DCubismCore.Moc.fromArrayBuffer(mocData);
      if (!moc) throw new Error('Failed to load moc');

      model = {
        moc,
        textures: [],
        drawables: [],
        parameters: [],
        parts: [],
        parameterValues: new Float32Array(moc.getParameterCount()),
        partOpacities: new Float32Array(moc.getPartCount()),
        parameterIds: [],
        partIds: [],
      };

      // Initialize parameter values
      const paramCount = moc.getParameterCount();
      for (let i = 0; i < paramCount; i++) {
        model.parameterValues[i] = moc.getParameterDefaultValue(i);
        model.parameterIds.push(moc.getParameterId(i));
      }

      // Initialize part opacities
      const partCount = moc.getPartCount();
      for (let i = 0; i < partCount; i++) {
        model.partOpacities[i] = 1.0;
        model.partIds.push(moc.getPartId(i));
      }

      // Load textures
      for (const texPath of modelJson.FileReferences.Textures) {
        const tex = await loadTexture(gl, MODEL_BASE + texPath);
        model.textures.push(tex);
      }

      // Load drawable data
      const drawableCount = moc.getDrawableCount();
      model.drawables = [];
      for (let i = 0; i < drawableCount; i++) {
        model.drawables.push({
          textureIndex: moc.getDrawableTextureIndex(i),
          vertexCount: moc.getDrawableVertexCount(i),
          vertexPositions: moc.getDrawableVertexPositions(i),
          vertexUvs: moc.getDrawableVertexUvs(i),
          indexCount: moc.getDrawableVertexIndexCount(i),
          indices: moc.getDrawableVertexIndices(i),
          renderOrder: moc.getDrawableRenderOrder(i),
          opacity: moc.getDrawableOpacity(i),
          constantFlags: moc.getDrawableConstantFlag(i),
          vertexBuffer: null,
          indexBuffer: null,
          uvBuffer: null,
        });

        const d = model.drawables[i];
        // Create vertex buffer
        d.vertexBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, d.vertexBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(d.vertexPositions), gl.DYNAMIC_DRAW);

        // Create UV buffer
        d.uvBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, d.uvBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(d.vertexUvs), gl.STATIC_DRAW);

        // Create index buffer
        d.indexBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, d.indexBuffer);
        gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(d.indices), gl.STATIC_DRAW);
      }

      // Load physics
      if (modelJson.FileReferences.Physics) {
        try {
          const physicsJson = await loadFile(MODEL_BASE + modelJson.FileReferences.Physics);
          physics = { data: physicsJson };
        } catch (e) { console.warn('Physics load failed:', e); }
      }

      // Load pose
      if (modelJson.FileReferences.Pose) {
        try {
          const poseJson = await loadFile(MODEL_BASE + modelJson.FileReferences.Pose);
          pose = { data: poseJson };
        } catch (e) { console.warn('Pose load failed:', e); }
      }

      // Load motions
      if (modelJson.FileReferences.Motions) {
        for (const [group, motionList] of Object.entries(modelJson.FileReferences.Motions)) {
          motions[group] = [];
          motionGroups.push(group);
          for (const m of motionList) {
            try {
              const motionData = await loadFile(MODEL_BASE + m.File);
              let sound = null;
              if (m.Sound) {
                sound = new Audio(MODEL_BASE + m.Sound);
              }
              motions[group].push({ data: motionData, sound });
            } catch (e) { console.warn(`Motion load failed: ${m.File}`, e); }
          }
        }
      }

      // Load expressions
      try {
        const expList = [
          'Angry', 'Blushing', 'Normal', 'Sad', 'Smile', 'Surprised', 'f01', 'f02'
        ];
        for (const name of expList) {
          try {
            const expData = await loadFile(MODEL_BASE + 'expressions/' + name + '.exp3.json');
            expressions[name] = expData;
          } catch (e) { /* ignore missing expressions */ }
        }
      } catch (e) { console.warn('Expression load failed:', e); }

      // Initialize eye blink
      eyeBlink = { state: 0, nextBlinkTime: 0, interval: 4.0 };

      // Initialize breath
      breath = { time: 0 };

      // Setup model matrix
      modelMatrix = new CubismMatrix44();
      modelMatrix.identity();

      // Setup events
      setupEvents();

      // Hide loading
      document.getElementById('loading').style.display = 'none';

      // Start render loop
      lastTime = performance.now();
      requestAnimationFrame(render);
    }

    // ==================== Physics Simulation ====================
    function updatePhysics(delta) {
      if (!physics || !physics.data) return;
      const p = physics.data;
      if (!p.PhysicsSettings) return;

      const settings = p.PhysicsSettings;
      for (let i = 0; i < settings.length; i++) {
        const s = settings[i];
        const paramIdx = model.parameterIds.indexOf(s.Id);
        if (paramIdx < 0) continue;

        // Simple spring-damper physics
        let val = model.parameterValues[paramIdx];
        const target = s.Ref ? getParameterValueByName(s.Ref) : 0;
        const effectiveMass = s.EffectiveMass || 1;
        const effectiveForces = s.EffectiveForces || { Gravity: { x: 0, y: -1 } };

        // Gravity effect
        val += (effectiveForces.Gravity?.y || 0) * effectiveMass * delta * 0.5;

        // Spring to target
        const stiffness = 0.1;
        val += (target - val) * stiffness * Math.min(delta * 10, 1);

        model.parameterValues[paramIdx] = val;
      }
    }

    function updatePose(delta) {
      if (!pose || !pose.data) return;
      const p = pose.data;
      if (!p.Groups) return;

      for (let i = 0; i < p.Groups.length; i++) {
        const group = p.Groups[i];
        const parts = group.Parts;
        if (!parts || parts.length < 2) continue;

        // Simple pose: link parts together
        for (let j = 1; j < parts.length; j++) {
          const srcIdx = model.partIds.indexOf(parts[0].Id);
          const dstIdx = model.partIds.indexOf(parts[j].Id);
          if (srcIdx >= 0 && dstIdx >= 0) {
            model.partOpacities[dstIdx] = model.partOpacities[srcIdx];
          }
        }
      }
    }

    function updateEyeBlink(delta) {
      if (!eyeBlink) return;
      const now = performance.now() / 1000;

      if (eyeBlink.state === 0) {
        // Waiting for next blink
        if (now >= eyeBlink.nextBlinkTime) {
          eyeBlink.state = 1; // Closing
          eyeBlink.blinkStart = now;
        }
      } else if (eyeBlink.state === 1) {
        // Closing
        const elapsed = now - eyeBlink.blinkStart;
        const t = Math.min(elapsed / 0.1, 1.0);
        const val = 1.0 - t;
        setParameterValue('PARAM_EYE_L_OPEN', val);
        setParameterValue('PARAM_EYE_R_OPEN', val);
        if (t >= 1.0) {
          eyeBlink.state = 2; // Opening
          eyeBlink.blinkStart = now;
        }
      } else if (eyeBlink.state === 2) {
        // Opening
        const elapsed = now - eyeBlink.blinkStart;
        const t = Math.min(elapsed / 0.15, 1.0);
        const val = t;
        setParameterValue('PARAM_EYE_L_OPEN', val);
        setParameterValue('PARAM_EYE_R_OPEN', val);
        if (t >= 1.0) {
          eyeBlink.state = 0;
          eyeBlink.nextBlinkTime = now + 2.0 + Math.random() * eyeBlink.interval;
        }
      }

      if (eyeBlink.state === 0 && eyeBlink.nextBlinkTime === 0) {
        eyeBlink.nextBlinkTime = now + 2.0 + Math.random() * eyeBlink.interval;
      }
    }

    function updateBreath(delta) {
      if (!breath) return;
      breath.time += delta;
      const val = Math.sin(breath.time * 1.5) * 0.5 + 0.5;
      setParameterValue('PARAM_BREATH', val);
    }

    // ==================== Motion ====================
    function startMotion(group) {
      if (!motions[group] || motions[group].length === 0) return;
      const idx = Math.floor(Math.random() * motions[group].length);
      const m = motions[group][idx];
      if (!m || !m.data) return;

      motionManager.current = {
        data: m.data,
        startTime: performance.now() / 1000,
        sound: m.sound,
      };

      if (m.sound) {
        m.sound.currentTime = 0;
        m.sound.play().catch(() => {});
      }
    }

    // Pre-process motion curves into keyframe arrays for fast lookup
    function preprocessMotion(motionData) {
      if (!motionData || !motionData.Curves) return null;
      const duration = motionData.Meta ? motionData.Meta.Duration : 10;
      const processed = [];
      for (const curve of motionData.Curves) {
        const segs = curve.Segments;
        if (!segs || segs.length < 2) continue;
        // Extract (time, value) pairs by stepping by 2
        const keyframes = [];
        for (let i = 0; i < segs.length - 1; i += 2) {
          const t = segs[i];
          const v = segs[i + 1];
          // Filter: time must be in [0, duration] range
          if (t >= 0 && t <= duration + 0.1) {
            keyframes.push({ t, v });
          }
        }
        // Sort by time and deduplicate
        keyframes.sort((a, b) => a.t - b.t);
        const deduped = [];
        for (const kf of keyframes) {
          if (deduped.length === 0 || kf.t > deduped[deduped.length - 1].t + 0.001) {
            deduped.push(kf);
          }
        }
        if (deduped.length >= 2) {
          processed.push({
            id: curve.Id,
            target: curve.Target || 'Parameter',
            keyframes: deduped,
          });
        }
      }
      return processed;
    }

    function updateMotion(delta) {
      if (!motionManager.current) return;

      const m = motionManager.current;
      const elapsed = performance.now() / 1000 - m.startTime;

      // Preprocess on first use
      if (!m.processed) {
        m.processed = preprocessMotion(m.data);
      }

      if (!m.processed || m.processed.length === 0) {
        motionManager.current = null;
        return;
      }

      // Check if motion has ended
      const duration = m.data.Meta ? m.data.Meta.Duration : 10;
      if (elapsed > duration) {
        if (m.data.Meta && m.data.Meta.Loop) {
          m.startTime = performance.now() / 1000;
        } else {
          motionManager.current = null;
        }
        return;
      }

      // Apply motion curves
      for (const curve of m.processed) {
        const kfs = curve.keyframes;
        // Find the segment containing current time
        let segIdx = 0;
        for (let i = 0; i < kfs.length - 1; i++) {
          if (elapsed >= kfs[i].t && elapsed <= kfs[i + 1].t) {
            segIdx = i;
            break;
          }
        }

        const t0 = kfs[segIdx].t;
        const v0 = kfs[segIdx].v;
        const t1 = kfs[segIdx + 1].t;
        const v1 = kfs[segIdx + 1].v;

        let t = (t1 - t0 > 0.0001) ? (elapsed - t0) / (t1 - t0) : 0;
        t = Math.max(0, Math.min(1, t));
        const value = v0 + (v1 - v0) * t;

        if (curve.target === 'Parameter') {
          setParameterValue(curve.id, value);
        } else if (curve.target === 'PartOpacity') {
          setPartOpacity(curve.id, value);
        }
      }
    }

    function doRandomMotion() {
      const groups = ['Tap', 'Flick', 'FlickRight', 'FlickLeft', 'Flick3', 'Shake'];
      const group = groups[Math.floor(Math.random() * groups.length)];
      startMotion(group);
    }

    // ==================== Expression ====================
    function setExpression(name) {
      const exp = expressions[name];
      if (!exp) return;

      expressionManager.current = {
        data: exp,
        startTime: performance.now() / 1000,
      };
    }

    function updateExpression() {
      if (!expressionManager.current) return;
      const exp = expressionManager.current;
      if (!exp.data.Parameters) return;

      for (const param of exp.data.Parameters) {
        const currentVal = getParameterValueByName(param.Id);
        const blend = param.Blend || 'Add';
        let newVal;
        if (blend === 'Add') {
          newVal = currentVal + param.Value;
        } else if (blend === 'Multiply') {
          newVal = currentVal * param.Value;
        } else {
          newVal = param.Value;
        }
        setParameterValue(param.Id, newVal);
      }
      expressionManager.current = null;
    }

    // ==================== Parameter Helpers ====================
    function getParameterValueByName(id) {
      const idx = model.parameterIds.indexOf(id);
      if (idx >= 0) return model.parameterValues[idx];
      return 0;
    }

    function setParameterValue(id, value) {
      const idx = model.parameterIds.indexOf(id);
      if (idx >= 0) {
        const min = moc.getParameterMinimumValue(idx);
        const max = moc.getParameterMaximumValue(idx);
        model.parameterValues[idx] = Math.max(min, Math.min(max, value));
      }
    }

    function setPartOpacity(id, value) {
      const idx = model.partIds.indexOf(id);
      if (idx >= 0) {
        model.partOpacities[idx] = Math.max(0, Math.min(1, value));
      }
    }

    // ==================== Events ====================
    function setupEvents() {
      canvas.addEventListener('mousedown', (e) => {
        isDragging = true;
        lastMouseX = e.clientX;
        lastMouseY = e.clientY;
      });

      canvas.addEventListener('mousemove', (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;

        if (isDragging) {
          const dx = e.clientX - lastMouseX;
          const dy = e.clientY - lastMouseY;
          targetDragX += dx * 0.005;
          targetDragY += dy * 0.005;
          lastMouseX = e.clientX;
          lastMouseY = e.clientY;
        }
      });

      canvas.addEventListener('mouseup', (e) => {
        if (isDragging) {
          const dx = Math.abs(e.clientX - lastMouseX);
          const dy = Math.abs(e.clientY - lastMouseY);
          if (dx < 5 && dy < 5) {
            // Click, not drag
            doRandomMotion();
          }
        }
        isDragging = false;
      });

      canvas.addEventListener('mouseleave', () => {
        isDragging = false;
      });

      // Touch events
      canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (e.touches.length === 1) {
          isDragging = true;
          lastMouseX = e.touches[0].clientX;
          lastMouseY = e.touches[0].clientY;
          mouseX = e.touches[0].clientX;
          mouseY = e.touches[0].clientY;
        }
      });

      canvas.addEventListener('touchmove', (e) => {
        e.preventDefault();
        if (e.touches.length === 1 && isDragging) {
          const dx = e.touches[0].clientX - lastMouseX;
          const dy = e.touches[0].clientY - lastMouseY;
          targetDragX += dx * 0.005;
          targetDragY += dy * 0.005;
          lastMouseX = e.touches[0].clientX;
          lastMouseY = e.touches[0].clientY;
          mouseX = e.touches[0].clientX;
          mouseY = e.touches[0].clientY;
        }
      });

      canvas.addEventListener('touchend', (e) => {
        if (isDragging) {
          const dx = Math.abs((e.changedTouches[0]?.clientX || 0) - lastMouseX);
          const dy = Math.abs((e.changedTouches[0]?.clientY || 0) - lastMouseY);
          if (dx < 10 && dy < 10) {
            doRandomMotion();
          }
        }
        isDragging = false;
      });

      window.addEventListener('resize', () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      });
    }

    // ==================== Render ====================
    function render(timestamp) {
      requestAnimationFrame(render);

      const delta = Math.min((timestamp - lastTime) / 1000, 0.1);
      lastTime = timestamp;

      // Update model parameters
      updateMotion(delta);
      updateExpression();
      updateEyeBlink(delta);
      updateBreath(delta);
      updatePhysics(delta);
      updatePose(delta);

      // Idle motion auto-play
      if (!motionManager.current && !isDragging) {
        idleTimer += delta;
        if (idleTimer >= idleMotionInterval) {
          idleTimer = 0;
          idleMotionInterval = 4 + Math.random() * 8;
          startMotion('Idle');
        }
      } else if (motionManager.current) {
        idleTimer = 0;
      }

      // Smooth drag
      dragX += (targetDragX - dragX) * 0.1;
      dragY += (targetDragY - dragY) * 0.1;

      // Mouse tracking for head
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const headX = ((mouseX || cx) - cx) / cx * 0.5;
      const headY = ((mouseY || cy) - cy) / cy * 0.3;

      setParameterValue('PARAM_ANGLE_X', headX * 30 + dragX * 30);
      setParameterValue('PARAM_ANGLE_Y', headY * 30 - dragY * 30);
      setParameterValue('PARAM_ANGLE_Z', dragX * 20);
      setParameterValue('PARAM_BODY_ANGLE_X', dragX * 10);
      setParameterValue('PARAM_BODY_ANGLE_Y', dragY * 10);
      setParameterValue('PARAM_EYE_BALL_X', headX * 1.5);
      setParameterValue('PARAM_EYE_BALL_Y', headY * 1.5);

      // Update vertex positions
      const drawableCount = moc.getDrawableCount();
      moc.updateModel(model.parameterValues);

      // Clear
      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.viewport(0, 0, canvas.width, canvas.height);

      // Setup projection matrix
      const projection = new CubismMatrix44();
      projection.identity();
      projection.scale(2.0 / canvas.width, -2.0 / canvas.height, 1);
      projection.translate(-canvas.width / 2, -canvas.height / 2, 0);

      // Model matrix
      modelMatrix.identity();
      modelMatrix.scale(scale, scale, 1);
      modelMatrix.translate(offsetX, offsetY, 0);

      const mvp = new CubismMatrix44();
      mvp.multiply(projection, modelMatrix);

      // Sort drawables by render order
      const sorted = model.drawables.map((d, i) => ({ ...d, idx: i }))
        .sort((a, b) => a.renderOrder - b.renderOrder);

      for (const d of sorted) {
        if (d.opacity <= 0.01) continue;

        const partOpacity = model.partOpacities[
          moc.getDrawableParentPartIndex(d.idx)
        ] ?? 1;

        const finalOpacity = d.opacity * partOpacity;
        if (finalOpacity <= 0.01) continue;

        // Update vertex buffer with new positions
        const newPositions = moc.getDrawableVertexPositions(d.idx);
        gl.bindBuffer(gl.ARRAY_BUFFER, d.vertexBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(newPositions), gl.DYNAMIC_DRAW);

        // Bind texture
        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, model.textures[d.textureIndex]);

        // Set uniforms
        gl.uniformMatrix4fv(u_matrix, false, mvp.array);
        gl.uniform1i(u_texture, 0);
        gl.uniform4f(u_baseColor, 1, 1, 1, finalOpacity);
        gl.uniform4f(u_multiplyColor, 0, 0, 0, 0);
        gl.uniform4f(u_screenColor, 0, 0, 0, 0);

        // Bind vertex attributes
        gl.bindBuffer(gl.ARRAY_BUFFER, d.vertexBuffer);
        gl.enableVertexAttribArray(a_position);
        gl.vertexAttribPointer(a_position, 2, gl.FLOAT, false, 0, 0);

        gl.bindBuffer(gl.ARRAY_BUFFER, d.uvBuffer);
        gl.enableVertexAttribArray(a_texCoord);
        gl.vertexAttribPointer(a_texCoord, 2, gl.FLOAT, false, 0, 0);

        // Draw
        gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, d.indexBuffer);
        gl.drawElements(gl.TRIANGLES, d.indexCount, gl.UNSIGNED_SHORT, 0);
      }

      // Fade hint
      const hint = document.getElementById('hint');
      if (timestamp > 8000 && hint.style.opacity !== '0') {
        hint.style.transition = 'opacity 1.5s';
        hint.style.opacity = '0';
      }
    }

    // ==================== Start ====================
    window.doRandomMotion = doRandomMotion;
    window.setExpression = setExpression;

    init().catch(err => {
      console.error('Initialization failed:', err);
      document.getElementById('loading').innerHTML =
        `<span style="color:#f66">加载失败: ${err.message}</span>`;
    });
  </script>
</body>
</html>
