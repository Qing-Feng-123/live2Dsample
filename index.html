<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live2D - Hiyori 交互演示</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      overflow: hidden;
      user-select: none;
    }
    #container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    canvas { display: block; }

    /* 提示文字 */
    .hint {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.7);
      font-size: 14px;
      letter-spacing: 2px;
      pointer-events: none;
      z-index: 10;
      animation: fadeInOut 3s ease-in-out infinite;
    }
    @keyframes fadeInOut {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.9; }
    }

    /* 控制面板 */
    .controls {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      z-index: 10;
      flex-wrap: wrap;
      justify-content: center;
    }
    .btn {
      padding: 10px 22px;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 25px;
      background: rgba(255,255,255,0.08);
      color: #fff;
      cursor: pointer;
      font-size: 14px;
      letter-spacing: 1px;
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
      white-space: nowrap;
    }
    .btn:hover {
      background: rgba(255,255,255,0.2);
      border-color: rgba(255,255,255,0.6);
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.3);
    }
    .btn:active {
      transform: translateY(0);
      background: rgba(255,255,255,0.3);
    }
    .btn.active {
      background: rgba(100,180,255,0.3);
      border-color: rgba(100,180,255,0.7);
    }

    /* 加载提示 */
    .loading {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      font-size: 18px;
      letter-spacing: 3px;
      z-index: 100;
    }
    .loading.hidden { display: none; }

    /* 粒子背景 */
    .particles {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
    }
    .particle {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,0.3);
      animation: floatUp linear infinite;
    }
    @keyframes floatUp {
      0% { transform: translateY(100vh) scale(0); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-10vh) scale(1); opacity: 0; }
    }
  </style>
</head>
<body>
  <!-- 粒子背景 -->
  <div class="particles" id="particles"></div>

  <!-- 加载提示 -->
  <div class="loading" id="loading">Loading...</div>

  <!-- 提示 -->
  <div class="hint" id="hint">移动鼠标  |  点击角色  |  按钮切换动作</div>

  <!-- 画布容器 -->
  <div id="container"></div>

  <!-- 控制面板 -->
  <div class="controls" id="controls">
    <button class="btn" data-motion="Idle">待机</button>
    <button class="btn" data-motion="Tap">点击头部</button>
    <button class="btn" data-motion="Tap@Body">点击身体</button>
    <button class="btn" data-motion="Flick">滑动</button>
    <button class="btn" data-motion="FlickDown">下滑</button>
    <button class="btn" data-motion="Flick@Body">滑动身体</button>
  </div>

  <!-- 脚本 -->
  <script src="live2dcubismcore.min.js"></script>
  <script src="node_modules/pixi.js-legacy/dist/browser/pixi-legacy.min.js"></script>
  <script src="node_modules/pixi-live2d-display/dist/cubism4.min.js"></script>

  <script>
  (function() {
    // 粒子背景
    const particlesContainer = document.getElementById('particles');
    for (let i = 0; i < 30; i++) {
      const particle = document.createElement('div');
      particle.className = 'particle';
      const size = Math.random() * 4 + 2;
      particle.style.width = size + 'px';
      particle.style.height = size + 'px';
      particle.style.left = Math.random() * 100 + '%';
      particle.style.animationDuration = Math.random() * 8 + 6 + 's';
      particle.style.animationDelay = Math.random() * 8 + 's';
      particlesContainer.appendChild(particle);
    }

    // 主程序
    const container = document.getElementById('container');
    const loadingEl = document.getElementById('loading');
    const hintEl = document.getElementById('hint');
    const buttons = document.querySelectorAll('.btn');

    // 创建 PixiJS 应用
    const app = new PIXI.Application({
      view: document.createElement('canvas'),
      width: window.innerWidth,
      height: window.innerHeight,
      transparent: true,
      antialias: true,
      resolution: window.devicePixelRatio || 1,
      autoDensity: true,
      backgroundAlpha: 0,
    });

    container.appendChild(app.view);

    // 注册 PIXI.Ticker 用于自动更新
    PIXI.live2d.Live2DModel.registerTicker(PIXI.Ticker);

    let model = null;
    let isDragging = false;
    let dragStartX = 0;
    let dragStartY = 0;

    // 加载模型
    async function loadModel() {
      try {
        // 加载 Live2D 模型
        model = await PIXI.live2d.Live2DModel.from(
          'hiyori_free/hiyori_free/runtime/hiyori_free_t08.model3.json',
          {
            autoUpdate: true,
            autoInteract: true,
          }
        );

        // 设置模型位置和缩放
        model.anchor.set(0.5, 0.5);
        model.x = app.view.width / 2;
        model.y = app.view.height / 2;
        model.scale.set(0.18);

        // 设置交互
        model.interactive = true;
        model.buttonMode = true;

        app.stage.addChild(model);

        // 隐藏加载提示
        loadingEl.classList.add('hidden');

        // 模型加载完成后开始随机待机动画
        setTimeout(() => {
          model.motion('Idle');
        }, 500);

        // 设置自动待机动画循环
        setInterval(() => {
          if (model && !isDragging) {
            const motionManager = model.internalModel.motionManager;
            if (motionManager && !motionManager.isPlaying()) {
              model.motion('Idle');
            }
          }
        }, 8000);

        // 鼠标/触摸移动 - 视线跟随
        app.view.addEventListener('mousemove', (e) => {
          if (!model || isDragging) return;
          const rect = app.view.getBoundingClientRect();
          const x = (e.clientX - rect.left) / rect.width;
          const y = (e.clientY - rect.top) / rect.height;
          // 将屏幕坐标映射到模型坐标空间
          model.focus(
            (x - 0.5) * model.width * 0.8,
            (y - 0.5) * model.height * 0.8,
            false
          );
        });

        app.view.addEventListener('touchmove', (e) => {
          if (!model || isDragging) return;
          e.preventDefault();
          const rect = app.view.getBoundingClientRect();
          const x = (e.touches[0].clientX - rect.left) / rect.width;
          const y = (e.touches[0].clientY - rect.top) / rect.height;
          model.focus(
            (x - 0.5) * model.width * 0.8,
            (y - 0.5) * model.height * 0.8,
            false
          );
        }, { passive: false });

        // 点击交互 - 触发 tap 动作
        model.on('pointerdown', (e) => {
          if (!model) return;
          const point = e.data.getLocalPosition(model);
          // 触发点击检测
          model.tap(point.x, point.y);
        });

        // 拖拽旋转模型
        model.on('pointerdown', (e) => {
          isDragging = true;
          dragStartX = e.data.global.x;
          dragStartY = e.data.global.y;
        });

        app.view.addEventListener('mousemove', (e) => {
          if (!isDragging || !model) return;
          const dx = e.clientX - dragStartX;
          const dy = e.clientY - dragStartY;
          dragStartX = e.clientX;
          dragStartY = e.clientY;
          model.x += dx;
          model.y += dy;
        });

        app.view.addEventListener('mouseup', () => {
          isDragging = false;
        });

        app.view.addEventListener('mouseleave', () => {
          isDragging = false;
        });

        // 触摸拖拽
        app.view.addEventListener('touchstart', (e) => {
          if (e.touches.length === 2) {
            isDragging = true;
            dragStartX = e.touches[0].clientX;
            dragStartY = e.touches[0].clientY;
          }
        });

        app.view.addEventListener('touchmove', (e) => {
          if (!isDragging || !model) return;
          if (e.touches.length === 1) {
            const dx = e.touches[0].clientX - dragStartX;
            const dy = e.touches[0].clientY - dragStartY;
            dragStartX = e.touches[0].clientX;
            dragStartY = e.touches[0].clientY;
            model.x += dx;
            model.y += dy;
          }
        }, { passive: false });

        app.view.addEventListener('touchend', () => {
          isDragging = false;
        });

        // 滚轮缩放
        app.view.addEventListener('wheel', (e) => {
          if (!model) return;
          e.preventDefault();
          const scaleFactor = e.deltaY > 0 ? 0.95 : 1.05;
          const newScale = model.scale.x * scaleFactor;
          model.scale.set(Math.max(0.05, Math.min(0.5, newScale)));
        }, { passive: false });

        console.log('Live2D 模型加载成功！');

      } catch (err) {
        console.error('模型加载失败:', err);
        loadingEl.textContent = '加载失败，请刷新页面重试';
        loadingEl.style.color = '#ff6b6b';
      }
    }

    // 按钮事件
    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        if (!model) return;
        const motionGroup = btn.dataset.motion;
        model.motion(motionGroup);

        // 高亮按钮
        buttons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        setTimeout(() => btn.classList.remove('active'), 600);
      });
    });

    // 键盘快捷键
    document.addEventListener('keydown', (e) => {
      if (!model) return;
      switch(e.key.toLowerCase()) {
        case '1': model.motion('Idle'); break;
        case '2': model.motion('Tap'); break;
        case '3': model.motion('Tap@Body'); break;
        case '4': model.motion('Flick'); break;
        case '5': model.motion('FlickDown'); break;
        case '6': model.motion('Flick@Body'); break;
        case 'r':
          model.x = app.view.width / 2;
          model.y = app.view.height / 2;
          model.scale.set(0.18);
          break;
        default: break;
      }
    });

    // 窗口大小调整
    window.addEventListener('resize', () => {
      app.renderer.resize(window.innerWidth, window.innerHeight);
      if (model) {
        model.x = app.view.width / 2;
        model.y = app.view.height / 2;
      }
    });

    // 启动加载
    loadModel();

  })();
  </script>
</body>
</html>
