<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live2D 桃濑日和 - 交互预览</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; }
    #app { width: 100%; height: 100%; position: relative; }
    canvas { display: block; }

    /* 控制面板 */
    .controls {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      z-index: 10;
      background: rgba(0,0,0,0.6);
      padding: 10px 20px;
      border-radius: 30px;
      backdrop-filter: blur(10px);
    }
    .controls button {
      padding: 8px 18px;
      border: 1px solid rgba(255,255,255,0.3);
      background: rgba(255,255,255,0.1);
      color: #fff;
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .controls button:hover {
      background: rgba(255,255,255,0.25);
      border-color: rgba(255,255,255,0.6);
    }
    .controls button.active {
      background: rgba(100,180,255,0.4);
      border-color: rgba(100,180,255,0.8);
    }

    /* 提示信息 */
    .hint {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.7);
      font-size: 14px;
      font-family: 'Segoe UI', system-ui, sans-serif;
      z-index: 10;
      text-align: center;
      pointer-events: none;
    }

    /* 加载状态 */
    .loading {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      font-size: 18px;
      font-family: 'Segoe UI', system-ui, sans-serif;
      z-index: 100;
      text-align: center;
    }
    .loading .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.2);
      border-top: 3px solid #64b4ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="app">
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <div>加载模型中...</div>
    </div>
    <div class="hint">拖拽移动 · 滚轮缩放 · 点击互动</div>
    <div class="controls" id="controls">
      <button id="btn-idle" class="active">待机</button>
      <button id="btn-tap">点击</button>
      <button id="btn-flick">滑动</button>
      <button id="btn-reset">重置</button>
    </div>
  </div>

  <!-- 先加载 Cubism Core -->
  <script src="/node_modules/live2dcubismcore/live2dcubismcore.min.js"></script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
